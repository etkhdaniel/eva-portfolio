    <link rel="stylesheet" href="styles.css?v=20261018-social-links" />
  </head>
  <body>
    <header class="site-header" aria-label="Primary">
      <a class="brand" href="index.html">EVA DANIEL</a>
      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="experience.html">EXPERIENCE</a>
        <a href="projects.html">PROJECTS</a>

        <a href="contact.html" aria-current="page">CONTACT</a>
        <a href="cv.html">CV</a>
      </nav>
    </header>

    <main>
      <section class="contact-section page-section" aria-labelledby="contact-title">
        <div class="section-label">
          <h1 id="contact-title">CONTACT FORM</h1>
          <p>Send a note and it will open as an email draft.</p>
        </div>

        <div class="contact-content">
          <nav class="social-links" aria-label="Social profiles">
            <a
              class="social-link"
              href="https://www.linkedin.com/in/evahdaniel/"
              target="_blank"
              rel="noreferrer"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z" />
                <path d="M2 9h4v12H2z" />
                <circle cx="4" cy="4" r="2" />
              </svg>
              <span>LinkedIn</span>
            </a>
            <a
              class="social-link"
              href="https://github.com/etkhdaniel"
              target="_blank"
              rel="noreferrer"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.3 4 5 5 0 0 0 19.2.5S18 0 15 2a13.4 13.4 0 0 0-7 0C5 .1 3.8.5 3.8.5A5 5 0 0 0 3.7 4a5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.5 6.5 6.8 7A4.8 4.8 0 0 0 8 18v4" />
                <path d="M8 19c-3 .9-3-1.5-4-2" />
              </svg>
              <span>GitHub</span>
            </a>
            <a
              class="social-link"
              href="https://beliapp.co/app/evadaniel"
              target="_blank"
              rel="noreferrer"
            >
              <svg class="social-beli-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M9 7.5v9h3.4a3 3 0 0 0 0-6H9m0 0h3a2.5 2.5 0 0 0 0-5H9" />
              </svg>
              <span>Beli</span>
            </a>
          </nav>

          <form class="contact-form" id="contact-form">
            <label>
              <span>NAME</span>
              <input name="name" autocomplete="name" required />
            </label>
            <label>
              <span>EMAIL</span>
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>MESSAGE</span>
              <textarea name="message" rows="6" required></textarea>
            </label>
            <button type="submit">SEND</button>
          </form>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
